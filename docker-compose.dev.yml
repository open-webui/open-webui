version: '3.8'
services:
  tracexgpt:
    image: ghcr.io/open-webui/open-webui:latest
    ports:
      - "3000:8080"
    volumes:
      # Mount your custom Python backend files
      - ./backend/open_webui/tools/builtin.py:/app/backend/open_webui/tools/builtin.py:ro
      - ./backend/open_webui/config.py:/app/backend/open_webui/config.py:ro
      - ./backend/open_webui/tasks.py:/app/backend/open_webui/tasks.py:ro
      # Data persistence
      - tracexgpt-data:/app/backend/data
    environment:
      - ENV=dev
      - WEBUI_NAME=TracexGPT Dev
      - ENABLE_SIGNUP=false
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - FILE_TTL_DAYS=120
      - WEBUI_SECRET_KEY=dev-secret-key-change-in-production

volumes:
  tracexgpt-data:
