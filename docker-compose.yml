version: "3.8"

services:
  webui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openwebui_geo
    network_mode: host
    volumes:
      - ./:/app:rw
    environment:
      HOST: "0.0.0.0"
      PORT: "8503"
      PYTHONUNBUFFERED: "1"
    working_dir: /app/backend
    restart: unless-stopped
