name: Build the Outis-Mneme image

# Publishes a single, standard-variant image of this fork so others can pull
# the Outis-Mneme theme without building it themselves.
#
# The repo's own docker.yaml builds five variants (standard, cuda, cuda126,
# ollama, slim) across two architectures. That is the right shape for the
# upstream project and the wrong shape here: the CUDA images are ~10GB each
# and nothing about this branch changes them. This builds the standard
# variant only, and otherwise follows docker.yaml's proven pattern —
# per-architecture native runners pushing by digest, then one merge job
# stitching them into a multi-arch manifest.

on:
  workflow_dispatch:
  push:
    branches:
      - theme/outis-mneme

concurrency:
  group: outis-mneme-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: linux/amd64
            runner: ubuntu-latest
          - arch: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      # No QEMU step: each architecture builds on its own native runner, and
      # the frontend stage is pinned to $BUILDPLATFORM, so nothing is emulated.
      - name: Prepare environment
        run: |
          echo "FULL_IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
          platform=${{ matrix.platform.arch }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> ${GITHUB_ENV}

      - name: Checkout repository
        uses: actions/checkout@v5

      # The Dockerfile pins the frontend build to a 4096MB Node heap, which is
      # what it took to stop the OOM locally. Runners have far more room, so
      # raise it here for headroom as the bundle grows. Rewrites the existing
      # value rather than inserting a second ENV, which a later line would
      # otherwise override.
      - name: Raise the frontend build's Node heap for CI
        run: |
          sed -E 's/--max-old-space-size=[0-9]+/--max-old-space-size=8192/' \
            Dockerfile > "${RUNNER_TEMP}/Dockerfile"
          grep -n 'max-old-space-size' "${RUNNER_TEMP}/Dockerfile"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker images
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=raw,value=outis-mneme
            type=sha,prefix=outis-mneme-,format=short
          flavor: |
            latest=false

      - name: Build and push by digest
        uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile
          platforms: ${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.FULL_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.FULL_IMAGE_NAME }}:cache-outis-mneme-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=${{ env.FULL_IMAGE_NAME }}:cache-outis-mneme-${{ env.PLATFORM_PAIR }},mode=max
          sbom: true
          build-args: |
            BUILD_HASH=${{ github.sha }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-outis-mneme-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare environment
        run: echo "FULL_IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Download digests
        uses: actions/download-artifact@v5
        with:
          pattern: digests-outis-mneme-*
          path: /tmp/digests
          merge-multiple: true

      # Both architectures must be present, otherwise the manifest would
      # silently publish as single-arch and amd64 or arm64 users would get a
      # "no matching manifest" error on pull.
      - name: Require both architectures
        run: |
          count=$(find /tmp/digests -type f | wc -l | tr -d ' ')
          if [ "$count" -ne 2 ]; then
            echo "::error::found $count digest(s), expected 2 (one per architecture)"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker images
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=raw,value=outis-mneme
            type=sha,prefix=outis-mneme-,format=short
          flavor: |
            latest=false

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.FULL_IMAGE_NAME }}@sha256:%s ' *)

      - name: Summarise
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            jq -r '.tags[] | "docker pull " + .' <<< "$DOCKER_METADATA_OUTPUT_JSON"
            echo '```'
            echo
            echo "Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
