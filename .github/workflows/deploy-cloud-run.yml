name: Deploy Open WebUI

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  PROJECT_ID: employee-ai-508209
  REGION: us-central1
  SERVICE: openwebui
  AR_REPOSITORY: openwebui-repo
  IMAGE_NAME: open-web-ui

jobs:
  deploy:
    name: Build and Deploy Open WebUI
    runs-on: ubuntu-latest

    steps:

      # -------------------------------
      # 1. Checkout
      # -------------------------------
      - name: Checkout source
        uses: actions/checkout@v7

      # -------------------------------
      # 2. Authenticate using SA key
      # -------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          project_id: ${{ env.PROJECT_ID }}

      # -------------------------------
      # 3. Setup gcloud
      # -------------------------------
      - name: Setup Google Cloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      # -------------------------------
      # 4. Configure Docker
      # -------------------------------
      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            ${REGION}-docker.pkg.dev \
            --quiet

      # -------------------------------
      # 5. Create image tag
      # -------------------------------
      - name: Set image
        id: image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "IMAGE=${IMAGE}" >> "$GITHUB_OUTPUT"

          echo "Building image:"
          echo "${IMAGE}"

      # -------------------------------
      # 6. Build
      # -------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.image.outputs.IMAGE }}" \
            .

      # -------------------------------
      # 7. Push
      # -------------------------------
      - name: Push Docker image
        run: |
          docker push "${{ steps.image.outputs.IMAGE }}"

      # -------------------------------
      # 8. Deploy directly to existing
      #    Cloud Run service
      # -------------------------------
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${{ steps.image.outputs.IMAGE }}" \
            --quiet

      # -------------------------------
      # 9. Show deployment
      # -------------------------------
      - name: Show deployed revision
        run: |
          gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format="yaml(status.traffic)"
