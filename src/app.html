<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" href="/static/favicon.png" crossorigin="use-credentials" />
		<link
			rel="icon"
			type="image/png"
			href="/static/favicon-96x96.png"
			sizes="96x96"
			crossorigin="use-credentials"
		/>
		<link
			rel="icon"
			type="image/svg+xml"
			href="/static/favicon.svg"
			crossorigin="use-credentials"
		/>
		<link rel="shortcut icon" href="/static/favicon.ico" crossorigin="use-credentials" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/static/apple-touch-icon.png"
			crossorigin="use-credentials"
		/>
		<link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#171717" />
		<meta name="robots" content="noindex,nofollow" />

		<script src="/static/loader.js" defer crossorigin="use-credentials"></script>
		<link rel="stylesheet" href="/static/custom.css" crossorigin="use-credentials" />

		<script>
			function resizeIframe(obj) {
				obj.style.height = obj.contentWindow.document.documentElement.scrollHeight + 'px';
			}
		</script>

		<script>
			// On page load or when changing themes, best to add inline in `head` to avoid FOUC
			(() => {
				const metaThemeColorTag = document.querySelector('meta[name="theme-color"]');
				const prefersDarkTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

				if (!localStorage?.theme) {
					localStorage.theme = 'system';
				}

				if (localStorage.theme === 'system') {
					document.documentElement.classList.add(prefersDarkTheme ? 'dark' : 'light');
					metaThemeColorTag.setAttribute('content', prefersDarkTheme ? '#171717' : '#ffffff');
				} else if (localStorage.theme === 'oled-dark') {
					document.documentElement.style.setProperty('--color-gray-800', '#101010');
					document.documentElement.style.setProperty('--color-gray-850', '#050505');
					document.documentElement.style.setProperty('--color-gray-900', '#000000');
					document.documentElement.style.setProperty('--color-gray-950', '#000000');
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#000000');
				} else if (localStorage.theme === 'light') {
					document.documentElement.classList.add('light');
					metaThemeColorTag.setAttribute('content', '#ffffff');
				} else if (localStorage.theme === 'her') {
					document.documentElement.classList.add('her');
					metaThemeColorTag.setAttribute('content', '#983724');
				} else {
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#171717');
				}

				const preloadHref = document.documentElement.classList.contains('dark')
					? '/static/splash-dark.png'
					: '/static/splash.png';
				const preload = document.createElement('link');
				preload.rel = 'preload';
				preload.as = 'image';
				preload.href = preloadHref;
				preload.setAttribute('fetchpriority', 'high');
				document.head.appendChild(preload);

				window.matchMedia('(prefers-color-scheme: dark)').addListener((e) => {
					if (localStorage.theme === 'system') {
						if (e.matches) {
							document.documentElement.classList.add('dark');
							document.documentElement.classList.remove('light');
							metaThemeColorTag.setAttribute('content', '#171717');
						} else {
							document.documentElement.classList.add('light');
							document.documentElement.classList.remove('dark');
							metaThemeColorTag.setAttribute('content', '#ffffff');
						}
					}
				});
				const isDarkMode = document.documentElement.classList.contains('dark');

				const logo = document.createElement('img');
				logo.id = 'logo';
				logo.style =
					'position: absolute; width: auto; height: 6rem; top: 44%; left: 50%; transform: translateX(-50%); display:block;';
				logo.loading = 'eager';
				logo.fetchPriority = 'high';
				logo.src = isDarkMode ? '/static/splash-dark.png' : '/static/splash.png';

				document.addEventListener('DOMContentLoaded', function () {
					const splash = document.getElementById('splash-screen');
					if (document.documentElement.classList.contains('her')) {
						return;
					}

					if (splash) splash.prepend(logo);
				});
			})();
		</script>

		<title>Open WebUI</title>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div id="ocean-bg">
			<!-- Bioluminescent light caustics -->
			<div class="caustic-overlay"></div>
			
			<!-- Layered fluid wave paths -->
			<svg class="bg-wave bg-wave-1" viewBox="0 0 1200 120" preserveAspectRatio="none">
				<path d="M0,60 C300,100 600,20 900,80 L1200,60 L1200,120 L0,120 Z" fill="rgba(0, 242, 254, 0.04)">
					<animate attributeName="d" 
							 values="M0,60 C300,100 600,20 900,80 L1200,60 L1200,120 L0,120 Z;
									 M0,60 C300,40 600,80 900,30 L1200,60 L1200,120 L0,120 Z;
									 M0,60 C300,100 600,20 900,80 L1200,60 L1200,120 L0,120 Z" 
							 dur="20s" repeatCount="indefinite" />
				</path>
			</svg>
			<svg class="bg-wave bg-wave-2" viewBox="0 0 1200 120" preserveAspectRatio="none">
				<path d="M0,50 C350,20 650,90 950,40 L1200,70 L1200,120 L0,120 Z" fill="rgba(5, 255, 162, 0.03)">
					<animate attributeName="d" 
							 values="M0,50 C350,20 650,90 950,40 L1200,70 L1200,120 L0,120 Z;
									 M0,50 C350,80 650,30 950,70 L1200,50 L1200,120 L0,120 Z;
									 M0,50 C350,20 650,90 950,40 L1200,70 L1200,120 L0,120 Z" 
							 dur="15s" repeatCount="indefinite" />
				</path>
			</svg>
		</div>
		<div style="display: contents">%sveltekit.body%</div>

		<div
			id="splash-screen"
			style="position: fixed; z-index: 100; top: 0; left: 0; width: 100%; height: 100%"
		>
			<style type="text/css" nonce="">
				html {
					overflow-y: scroll !important;
				}
			</style>

			<div
				style="
					position: absolute;
					top: 33%;
					left: 50%;

					width: 24rem;
					transform: translateX(-50%);

					display: flex;
					flex-direction: column;
					align-items: center;
				"
			>
				<img
					id="logo-her"
					style="width: auto; height: 13rem"
					src="/static/splash.png"
					loading="eager"
					fetchpriority="high"
					class="animate-pulse-fast"
				/>

				<div style="position: relative; width: 24rem; margin-top: 0.5rem">
					<div
						id="progress-background"
						style="
							position: absolute;
							width: 100%;
							height: 0.75rem;

							border-radius: 9999px;
							background-color: #fafafa9a;
						"
					></div>

					<div
						id="progress-bar"
						style="
							position: absolute;
							width: 0%;
							height: 0.75rem;
							border-radius: 9999px;
							background-color: #fff;
						"
						class="bg-white"
					></div>
				</div>
			</div>

			<!-- <span style="position: absolute; bottom: 32px; left: 50%; margin: -36px 0 0 -36px">
				Footer content
			</span> -->
		</div>

		<!-- Premium Bioluminescent Abyssal Particle Generator -->
		<script>
			document.addEventListener("DOMContentLoaded", () => {
				const container = document.getElementById("ocean-bg");
				if (!container) return;
				
				// Generate larger premium light-blue bubbles
				const totalBubbles = 40;
				for (let i = 0; i < totalBubbles; i++) {
					const bubble = document.createElement("div");
					bubble.className = "bubble-premium";
					bubble.style.left = Math.random() * 100 + "vw";
					const size = Math.random() * 18 + 6; // 6px to 24px
					bubble.style.width = size + "px";
					bubble.style.height = size + "px";
					bubble.style.animationDuration = (Math.random() * 8 + 12) + "s"; // 12s to 20s
					bubble.style.animationDelay = (Math.random() * 12) + "s";
					bubble.style.opacity = (Math.random() * 0.25 + 0.05);
					container.appendChild(bubble);
				}

				// Generate smaller bioluminescent teal/green micro-particles
				const totalMicro = 60;
				for (let i = 0; i < totalMicro; i++) {
					const particle = document.createElement("div");
					particle.className = "micro-particle";
					particle.style.left = Math.random() * 100 + "vw";
					const size = Math.random() * 3 + 1.5; // 1.5px to 4.5px
					particle.style.width = size + "px";
					particle.style.height = size + "px";
					particle.style.animationDuration = (Math.random() * 10 + 8) + "s"; // 8s to 18s
					particle.style.animationDelay = (Math.random() * 10) + "s";
					particle.style.opacity = (Math.random() * 0.4 + 0.1);
					container.appendChild(particle);
				}
			});
		</script>
	</body>

	<style type="text/css" nonce="">
		html {
			overflow-y: hidden !important;
			overscroll-behavior-y: none;
		}

		#splash-screen {
			background: #fff;
		}

		html.dark #splash-screen {
			background: #000;
		}

		html.her #splash-screen {
			background: #983724;
		}

		#logo-her {
			display: none;
		}

		#progress-background {
			display: none;
		}

		#progress-bar {
			display: none;
		}

		html.her #logo {
			display: none;
		}

		html.her #logo-her {
			display: block;
			filter: invert(1);
		}

		html.her #progress-background {
			display: block;
		}

		html.her #progress-bar {
			display: block;
		}

		@media (max-width: 24rem) {
			html.her #progress-background {
				display: none;
			}

			html.her #progress-bar {
				display: none;
			}
		}

		@keyframes pulse {
			50% {
				opacity: 0.65;
			}
		}

		.animate-pulse-fast {
			animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
		}
	</style>
</html>
